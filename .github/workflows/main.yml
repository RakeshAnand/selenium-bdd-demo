name: Selenium BDD Automation Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to trigger the test manually from the GitHub website

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Execute Scoped Selenium Tests
      # Runs only your @Smoke scenario tags on the headless runner infrastructure
      run: mvn test "-Dcucumber.filter.tags=@Smoke"

    - name: Upload Cucumber Test Reports
      if: always() # Ensures reports upload even if tests fail
      uses: actions/upload-artifact@v4
      with:
        name: cucumber-execution-reports
        path: target/cucumber-reports/
        retention-days: 7
